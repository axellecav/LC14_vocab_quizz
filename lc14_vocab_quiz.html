function generateHint(word) {
  return word.split(' ').map(w => {
    if (!w) return '';
    if (w.length === 1) return w;
    return w[0] + '_'.repeat(w.length - 1);
  }).join(' ');
}

function normalize(s) {
  return s.toLowerCase().trim()
    .replace(/['']/g, "'")
    .replace(/\s+/g, ' ')
    .replace(/^(a |an |the )/i, '');
}

let queue = [];
let wrongIds = new Set();
let correct = 0;
let wrong = 0;
let current = null;
let answered = false;
let filterMode = 'all';
let total = 0;
let done = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(mode) {
  filterMode = mode;
  if (mode === 'all') {
    queue = shuffle(vocab.map((v, i) => i));
  } else {
    queue = shuffle([...wrongIds]);
    wrongIds.clear();
  }
  correct = 0; wrong = 0; answered = false;
  total = queue.length; done = 0;
  nextQuestion();
}

function setFilter(mode) {
  document.getElementById('btn-all').classList.toggle('active', mode === 'all');
  document.getElementById('btn-wrong').classList.toggle('active', mode === 'wrong');
  if (mode === 'wrong' && wrongIds.size === 0) {
    document.getElementById('quiz-area').innerHTML = '<div class="card" style="text-align:center;color:var(--color-text-secondary);padding:2rem">Aucune erreur pour le moment — continue le quiz !</div>';
    return;
  }
  startQuiz(mode);
}

function nextQuestion() {
  answered = false;
  if (queue.length === 0) {
    showEnd();
    return;
  }
  const idx = queue.shift();
  current = { idx, word: vocab[idx][0], definition: vocab[idx][1] };
  done++;
  updateStats();
  renderQuestion();
}

function updateStats() {
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
  document.getElementById('remaining-count').textContent = queue.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
}

function renderQuestion() {
  const hint = generateHint(current.word);
  document.getElementById('quiz-area').innerHTML = `
    <div class="card">
      <div class="question-num">Question ${done} / ${total}</div>
      <div class="definition">${current.definition}</div>
      <div class="hint">Indice : <code>${hint}</code></div>
      <div class="input-row">
        <input type="text" id="answer-input" placeholder="Votre réponse…" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button onclick="checkAnswer()">Vérifier</button>
      </div>
      <div id="feedback"></div>
      <div style="margin-top:0.75rem;text-align:right">
        <button class="skip-btn" onclick="skipQuestion()">Passer</button>
      </div>
    </div>
  `;
  const inp = document.getElementById('answer-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { answered ? nextQuestion() : checkAnswer(); } });
}

function checkAnswer() {
  if (answered) return;
  const inp = document.getElementById('answer-input');
  const userAnswer = inp.value.trim();
  if (!userAnswer) return;
  answered = true;
  inp.disabled = true;

  const correct_answer = current.word;
  const isCorrect = normalize(userAnswer) === normalize(correct_answer) ||
    userAnswer.toLowerCase().trim() === correct_answer.toLowerCase().trim();

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    correct++;
    fb.className = 'feedback correct';
    fb.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Correct !';
  } else {
    wrong++;
    wrongIds.add(current.idx);
    fb.className = 'feedback wrong';
    fb.innerHTML = `<i class="ti ti-x" aria-hidden="true"></i> La réponse était : <span class="answer">${correct_answer}</span>`;
  }
  updateStats();

  const area = document.getElementById('quiz-area');
  const btn = document.createElement('button');
  btn.className = 'btn-next';
  btn.textContent = queue.length === 0 ? 'Voir les résultats →' : 'Question suivante →';
  btn.onclick = nextQuestion;
  area.querySelector('.card').appendChild(btn);

  document.getElementById('btn-wrong').textContent = `Erreurs (${wrongIds.size})`;
}

function skipQuestion() {
  if (answered) return;
  wrongIds.add(current.idx);
  wrong++;
  const fb = document.getElementById('feedback');
  fb.className = 'feedback wrong';
  fb.innerHTML = `Réponse : <span class="answer">${current.word}</span>`;
  answered = true;
  document.getElementById('answer-input').disabled = true;
  updateStats();
  const area = document.getElementById('quiz-area');
  const btn = document.createElement('button');
  btn.className = 'btn-next';
  btn.textContent = queue.length === 0 ? 'Voir les résultats →' : 'Question suivante →';
  btn.onclick = nextQuestion;
  area.querySelector('.card').appendChild(btn);
  document.getElementById('btn-wrong').textContent = `Erreurs (${wrongIds.size})`;
}

function showEnd() {
  const total_done = correct + wrong;
  const pct = total_done > 0 ? Math.round((correct / total_done) * 100) : 0;
  let emoji = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📚';
  document.getElementById('quiz-area').innerHTML = `
    <div class="card end-card">
      <div style="font-size:40px;margin-bottom:0.5rem">${emoji}</div>
      <div class="score-big">${correct} / ${total_done}</div>
      <div class="score-label">${pct}% de bonnes réponses</div>
      ${wrongIds.size > 0 ? `<button onclick="setFilter('wrong')" style="margin-bottom:8px;cursor:pointer;width:100%;height:40px;font-size:14px">Retravailler les ${wrongIds.size} erreurs</button>` : ''}
      <button onclick="startQuiz('all')" style="cursor:pointer;width:100%;height:40px;font-size:14px">Recommencer (tout)</button>
    </div>
  `;
  document.getElementById('progress').style.width = '100%';
}

startQuiz('all');
